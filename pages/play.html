<!DOCTYPE html>
<head>
</head>
<style>
p {
    color: white;
    animation-duration: 1s;
    animation-name: slide-in;
}

.button {
    background-color: red;
    border: 2px solid white;
    border-radius: 25px;
    color: white;
    padding: 15px 32px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    cursor: pointer;

    animation-duration: 1s;
    animation-name: slide-in;

}
@keyframes slide-in {
    from {
        translate: 150vw 0;
        scale: 200% 1;
    }

    to {
        translate: 0 0;
        scale: 100% 1;
    }
}
</style>
<body style='background-color: black'>
<main>

    <p>hello world ashdfaksdf</p>

    <button class='button'>button</button>
</main>
</body>
</html>
